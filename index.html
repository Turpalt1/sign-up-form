<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Sign up</title>
  </head>
  <body>
    <div class="wrapper">
      <div class="left">
        <div class="logo"><img src="img/odin-lined.png" alt="logo" />Odin</div>
      </div>
      <div class="right">
        <p>
          Lorem ipsum dolor, sit amet consectetur adipisicing elit. Perferendis
          debitis eius accusantium optio. At totam illo quae incidunt animi
          fugit accusantium excepturi quo? Dicta quia impedit rerum optio
          corrupti culpa!
        </p>
        <b>You <i>know</i> you want to.</b>
        <form action="#" class="form">
          <h2>Let,s do this!</h2>
          <div class="form__content-lines">
            <div class="line">
              <label for="">First Name</label>
              <input type="text" name="first-name" />
            </div>
            <div class="line">
              <label for="">Last Name</label>
              <input type="text" name="last-name" />
            </div>
            <div class="line">
              <label for="">Email</label>
              <input type="email" name="email" />
            </div>
            <div class="line">
              <label for="">Phone number</label>
              <input type="number" name="phone" />
            </div>
            <div class="line">
              <label for="">Password</label>
              <input type="password" name="password" />
            </div>
            <div class="line">
              <label for="">Confirm Password</label>
              <input type="password" name="confirm-password" />
            </div>
          </div>
          <button type="submit">Create account</button>
          <p>Already have an account? <a href="#">Log in</a></p>
        </form>
      </div>
    </div>
  </body>
</html>
